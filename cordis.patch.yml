# edu-pack bundle
#
# Registers this bundle's skills with the harness. The skills live on disk as
# SKILL.md directories, and the filesystem skill provider scans a directory for
# them.
#
# `bundledSkillDir` must be an ABSOLUTE path, and a patch file cannot reliably
# compute one — so `install.mjs` writes this entry with the real path rather than
# shipping a plausible-looking guess. If you are reading this file unmodified, run
# the installer instead of copying it by hand.
#
# - insert:
#     - id: edu-pack-skills
#       name: "@deepseek-ai/dsh-skill-filesystem"
#       config:
#         bundledSkillDir: "/absolute/path/to/edu-pack/skills"

[]
